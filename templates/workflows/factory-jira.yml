# Flavour jira: a Jira automation rule sends a repository_dispatch when a ticket
# gets the label "Agent-Ready"; comments "/factory approve|rework|build|respec …"
# on the job's GitHub issue continue a waiting job.
name: factory (jira)
on:
  repository_dispatch:
    types: [factory-jira]          # payload: {"key": "PORTAL-512", "targets": "FWU-DE/a FWU-DE/b"}
  issue_comment:
    types: [created]

jobs:
  from-jira:
    if: github.event_name == 'repository_dispatch'
    uses: janrenz/factory/.github/workflows/run.yml@v0.2.1
    with:
      command: "jira ${{ github.event.client_payload.key }}"
      targets: ${{ github.event.client_payload.targets }}
    secrets: inherit

  from-comment:
    if: >
      github.event_name == 'issue_comment' &&
      contains(github.event.issue.labels.*.name, 'factory') &&
      startsWith(github.event.comment.body, '/factory ') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    uses: janrenz/factory/.github/workflows/run.yml@v0.2.1
    with:
      command: ${{ github.event.comment.body }}
    secrets: inherit
