# Reusable workflow: runs one factory command headless in the calling repo.
# Used by the jira and ticket-pr flavours (see flavours/ and templates/workflows/).
name: factory run
on:
  workflow_call:
    inputs:
      command:
        description: "Arguments for /factory, e.g. 'next', 'approve 012-x', or a feature text"
        required: true
        type: string
      factory_ref:
        description: "Tag or branch of janrenz/factory to run (pin a tag)"
        required: false
        type: string
        default: v0.2.1
      targets:
        description: "Space-separated owner/repo list for a multi-repo job (harness repos only)"
        required: false
        type: string
        default: ""
      model:
        required: false
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      FACTORY_GH_TOKEN:
        description: "Token that can push branches, open PRs and comment in the job repo and every target"
        required: true
      JIRA_BASE_URL:
        required: false
      JIRA_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false

concurrency:
  group: factory-${{ github.repository }}-${{ inputs.command }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FACTORY_GH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code and the factory
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add "janrenz/factory#${{ inputs.factory_ref }}"
          claude plugin install factory@janrenz-factory --scope user
          npx --yes playwright install --with-deps chromium
      - name: Git identity
        run: |
          git config --global user.name "factory[bot]"
          git config --global user.email "factory-bot@users.noreply.github.com"
          gh auth setup-git
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
      - name: Run /factory
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          FACTORY_HEADLESS: "1"
          FACTORY_TARGETS: ${{ inputs.targets }}
          CMD: ${{ inputs.command }}
        run: |
          CMD=$(printf '%s' "$CMD" | head -n1); CMD=${CMD#/factory }
          args=(-p "/factory:factory $CMD" --output-format stream-json --verbose
                --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent,SendMessage,TodoWrite,WebFetch")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          claude "${args[@]}" | tee factory-run.jsonl
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-run-${{ github.run_id }}
          path: factory-run.jsonl
          retention-days: 30
